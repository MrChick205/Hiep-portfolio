<section class="container contact reveal-on-scroll" id="contact">
  <div class="section-head">
    <span class="pill">Say hello</span>
    <h2>Let's Build Together</h2>
  </div>
  <p>If you'd like to collaborate or hire me, send me a message.</p>
  <form
    id="contactForm"
    data-endpoint="https://formsubmit.co/ajax/hvhiepbru@gmail.com"
    data-mailto="hvhiepbru@gmail.com"
  >
    <div class="form-row">
      <input type="text" name="name" placeholder="Full name" required />
      <input type="email" name="email" placeholder="Email" required />
    </div>
    <textarea name="message" rows="6" placeholder="Message" required></textarea>
    <button class="btn" type="submit">Send</button>
    <div class="form-message" aria-live="polite" role="status"></div>
    <p class="note">
      This form will POST to Formspree if you replace the placeholder endpoint.
      Otherwise it falls back to opening your mail client.
    </p>
  </form>
</section>
